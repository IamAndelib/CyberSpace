name: Android

on:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  pull_request:
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:
    inputs:
      publish_unsigned:
        description: 'Push the unsigned release APK to the build-output branch (for offline signing)'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build APKs
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build release and debug APKs, run lint
        run: ./gradlew assembleRelease assembleDebug lintRelease --stacktrace

      - name: Upload APKs and lint report
        uses: actions/upload-artifact@v4
        with:
          name: apks
          path: |
            android/app/build/outputs/apk/**/*.apk
            android/app/build/reports/lint-results-release.html
          retention-days: 14

      - name: Publish unsigned release APK to build-output branch
        if: github.event_name == 'workflow_dispatch' && inputs.publish_unsigned
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/build-output"
          mkdir -p "$out"
          cp app/build/outputs/apk/release/app-release-unsigned.apk "$out/"
          cd "$out"
          sha256sum app-release-unsigned.apk > app-release-unsigned.apk.sha256
          echo "Built from ${GITHUB_SHA} by run ${GITHUB_RUN_ID}" > SOURCE.txt
          git init -q -b build-output
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "Unsigned release build of ${GITHUB_SHA}"
          git push -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" build-output

  ui-test:
    name: Emulator theme test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Build test APKs
        working-directory: android
        run: ./gradlew assembleDebug assembleDebugAndroidTest --stacktrace

      - name: Run tests on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_7
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: ./android/scripts/ui-test.sh

      - name: Upload screenshots and test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-test-results
          path: |
            android/build/ui-screens
            android/app/build/reports/androidTests
            android/app/build/outputs/androidTest-results
          retention-days: 14
